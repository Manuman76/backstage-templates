apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | default('A Python service generated via Backstage') }}
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: ${{ values.componentType }}
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.system | default('default-system') }}
